<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#003566">
  <meta name="color-scheme" content="dark">
  <title>Startpage · Gabriele Lombardi Srl</title>
  <meta name="description" content="Startpage personale con ora, meteo, ricerca e collegamenti rapidi.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23003566'/%3E%3Cpath d='M50 18 84 47v35H59V61H41v21H16V47z' fill='%23f67828'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003566;
      --accent: #f67828;
      --accent-light: #ff9250;
      --white: #ffffff;
      --muted: rgba(233, 241, 249, .68);
      --faint: rgba(233, 241, 249, .46);
      --line: rgba(255, 255, 255, .14);
      --font: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --shadow: 0 24px 60px rgba(0, 18, 38, .38);
      --glass-bg: linear-gradient(150deg, rgba(255, 255, 255, .095), rgba(255, 255, 255, .04));
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html {
      background: var(--primary);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(28px, 5vw, 64px) clamp(16px, 4vw, 40px);
      display: flex;
      color: var(--white);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--primary);
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(246, 120, 40, .45);
      color: #fff;
    }

    .shell {
      width: min(960px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(28px, 4vw, 48px);
      align-items: start;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(24px, 3.2vw, 40px);
    }

    .reveal {
      opacity: 0;
      animation: rise .8s cubic-bezier(.2, .7, .2, 1) forwards;
    }

    .reveal--1 { animation-delay: .04s; }
    .reveal--2 { animation-delay: .13s; }
    .reveal--3 { animation-delay: .2s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .08);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      backdrop-filter: blur(16px) saturate(130%);
    }

    .hero {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vw, 72px);
    }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: none;
    }

    .clock__time {
      display: flex;
      align-items: flex-start;
      font-size: clamp(62px, 10.5vw, 128px);
      font-weight: 200;
      line-height: .95;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 22px 55px rgba(0, 14, 30, .4);
      white-space: nowrap;
    }

    .clock__sec {
      margin-left: .03em;
      font-size: 1em;
      font-weight: 200;
      line-height: inherit;
      letter-spacing: inherit;
      color: var(--accent-light);
      font-variant-numeric: tabular-nums;
    }

    .clock__sec::before {
      content: ":";
      margin-right: .02em;
      color: rgba(255, 255, 255, .38);
    }

    .clock__bar {
      width: 62px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), rgba(246, 120, 40, .05));
    }

    .weather {
      width: 338px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: none;
    }

    .weather__head {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-height: 17px;
      padding-right: 4px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .weather__pin {
      width: 12px;
      height: 12px;
      flex: none;
      color: var(--accent-light);
    }

    #wxPlace {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wx-retry {
      flex: none;
      appearance: none;
      padding: 3px 8px;
      border: 1px solid rgba(246, 120, 40, .4);
      border-radius: 999px;
      background: rgba(246, 120, 40, .15);
      color: #ffd3b5;
      font: inherit;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }

    .wx-retry:hover {
      background: rgba(246, 120, 40, .3);
      border-color: rgba(246, 120, 40, .7);
    }

    .wx-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 70px;
      padding: 11px 16px;
      border-radius: 18px;
    }

    .wx-card--today {
      background: linear-gradient(135deg, rgba(246, 120, 40, .19), rgba(255, 255, 255, .055) 64%);
      border-color: rgba(246, 120, 40, .3);
    }

    .wx-card__icon {
      flex: none;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(246, 120, 40, .14);
      color: var(--accent-light);
    }

    .wx-card__icon .icon {
      width: 26px;
      height: 26px;
    }

    .wx-card__info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .wx-card__top,
    .wx-card__bottom {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .wx-card__label {
      flex: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .17em;
      text-transform: uppercase;
      color: var(--accent-light);
    }

    .wx-card__desc {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      font-size: 11.5px;
      color: var(--muted);
    }

    .wx-card__temp {
      font-size: 25px;
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -.035em;
      font-variant-numeric: tabular-nums;
    }

    .wx-card__temp em {
      font-style: normal;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--faint);
      margin-right: 4px;
      vertical-align: 3px;
    }

    .wx-card__range {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .search-row {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .search {
      width: min(620px, 100%);
      height: 58px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 18px;
      border-radius: 999px;
      transition: border-color .22s ease, background .22s ease, box-shadow .22s ease;
    }

    .search:hover {
      border-color: rgba(255, 255, 255, .24);
      background: linear-gradient(150deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .05));
    }

    .search:focus-within {
      border-color: rgba(246, 120, 40, .72);
      background: linear-gradient(150deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .055));
      box-shadow: 0 0 0 4px rgba(246, 120, 40, .14), var(--shadow);
    }

    .search__icon {
      width: 20px;
      height: 20px;
      flex: none;
      color: var(--muted);
    }

    .search input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 16px;
    }

    .search input::placeholder { color: rgba(255, 255, 255, .46); }

    .search input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: linear-gradient(45deg, transparent 44%, rgba(255,255,255,.55) 45%, rgba(255,255,255,.55) 55%, transparent 56%),
                  linear-gradient(-45deg, transparent 44%, rgba(255,255,255,.55) 45%, rgba(255,255,255,.55) 55%, transparent 56%);
      cursor: pointer;
    }

    .search kbd {
      flex: none;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 7px;
      background: rgba(255, 255, 255, .06);
      color: var(--faint);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
    }

    .links {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 10px;
    }

    .link {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 92px;
      padding: 15px 8px 13px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: linear-gradient(160deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .032));
      color: rgba(255, 255, 255, .9);
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: .01em;
      text-align: center;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: transform .25s ease, background .25s ease, border-color .25s ease,
                  box-shadow .25s ease, color .25s ease;
    }

    .link .icon {
      width: 24px;
      height: 24px;
      color: var(--accent-light);
      transition: color .25s ease, transform .25s ease;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, .38);
      background: linear-gradient(160deg, var(--accent-light), var(--accent));
      box-shadow: 0 18px 38px rgba(246, 120, 40, .3);
      color: #fff;
      outline: none;
    }

    .link:hover .icon,
    .link:focus-visible .icon {
      color: #fff;
      transform: scale(1.06);
    }

    .link:focus-visible {
      box-shadow: 0 0 0 3px rgba(246, 120, 40, .38), 0 18px 38px rgba(246, 120, 40, .3);
    }

    .side {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
    }

    .panel__title {
      margin: 0;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--accent-light);
    }

    .panel__link {
      flex: none;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .03em;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s ease;
    }

    .panel__link:hover,
    .panel__link:focus-visible {
      color: var(--accent-light);
    }

    .calendar__frame {
      height: clamp(340px, 46vh, 500px);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, .06);
      box-shadow: var(--shadow);
    }

    .calendar__frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .notes {
      flex: 1;
      min-height: 200px;
    }

    .notes__area {
      flex: 1;
      width: 100%;
      min-height: 160px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--glass-bg);
      color: var(--white);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .08);
      font: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      transition: border-color .22s ease, box-shadow .22s ease;
    }

    .notes__area::placeholder {
      color: rgba(255, 255, 255, .38);
    }

    .notes__area:focus {
      outline: none;
      border-color: rgba(246, 120, 40, .72);
      box-shadow: 0 0 0 4px rgba(246, 120, 40, .14), var(--shadow);
    }

    .notes__status {
      flex: none;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .06em;
      color: var(--faint);
    }

    .sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .icon {
      display: block;
      width: 24px;
      height: 24px;
      flex: none;
    }

    :focus-visible {
      outline: 2px solid rgba(246, 120, 40, .8);
      outline-offset: 3px;
    }

    @media (min-width: 1024px) {
      .shell {
        width: min(1520px, 100%);
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: clamp(32px, 3.4vw, 56px);
        align-items: stretch;
      }

      .stage {
        align-items: flex-start;
        gap: clamp(22px, 2vw, 30px);
      }

      .hero {
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 22px;
      }

      .clock {
        align-items: flex-start;
      }

      .clock__time {
        font-size: clamp(64px, 7vw, 104px);
      }

      .weather {
        width: min(420px, 100%);
      }

      .weather__head {
        justify-content: flex-start;
        padding-right: 0;
      }

      .search-row {
        justify-content: flex-start;
      }

      .search {
        width: min(520px, 100%);
      }

      .links {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .hero {
        flex-direction: column;
        gap: 28px;
      }

      .weather {
        width: min(360px, 100%);
      }

      .weather__head {
        justify-content: center;
        padding-right: 0;
      }

      .clock__bar {
        width: 52px;
      }

      .links {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 26px 16px 30px;
      }

      .stage {
        gap: 22px;
      }

      .clock__time {
        font-size: clamp(48px, 16vw, 84px);
      }

      .search {
        height: 54px;
        padding: 0 16px;
      }

      .search kbd { display: none; }

      .links {
        gap: 8px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .link {
        min-height: 84px;
        padding: 12px 6px 10px;
        border-radius: 16px;
        font-size: 10.5px;
      }

      .link .icon {
        width: 22px;
        height: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        opacity: 1;
        animation: none;
      }

      .link,
      .link .icon,
      .search {
        transition: none;
      }

      .link:hover,
      .link:focus-visible {
        transform: none;
      }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';

      /* ------------------------------------------------------------------
         Impostazioni
         ------------------------------------------------------------------ */
      const CONFIG = {
        // Località predefinita del meteo. Con null viene rilevata automaticamente dall'IP.
        fixedLocation: { name: 'Pietrasanta', latitude: 43.95952, longitude: 10.22784 },
        // Usata solo se il rilevamento automatico della posizione (via IP) fallisce.
        fallbackLocation: { name: 'Roma', latitude: 41.9028, longitude: 12.4964 },
        requestTimeoutMs: 9000,
        weatherCacheMs: 15 * 60 * 1000,
        locationCacheMs: 24 * 60 * 60 * 1000,
        weatherRefreshMs: 30 * 60 * 1000
      };

      const LS_LOCATION = 'startpage.location.v2';
      const LS_WEATHER = 'startpage.weather.v2';
      const LS_NOTES = 'startpage.notes.v1';

      const $ = (id) => document.getElementById(id);

      /* ------------------------------------------------------------------
         Utility
         ------------------------------------------------------------------ */
      const pad = (value) => String(value).padStart(2, '0');

      function readJSON(key) {
        try {
          return JSON.parse(localStorage.getItem(key) || 'null');
        } catch {
          return null;
        }
      }

      function writeJSON(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          /* Storage non disponibile: la pagina funziona comunque. */
        }
      }

      async function fetchJSON(url, timeoutMs = CONFIG.requestTimeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(url, {
            signal: controller.signal,
            headers: { Accept: 'application/json' }
          });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return await response.json();
        } finally {
          clearTimeout(timer);
        }
      }

      const fmtTemp = (value) => (Number.isFinite(value) ? `${Math.round(value)}°` : '—°');

      /* ------------------------------------------------------------------
         Orologio e data
         ------------------------------------------------------------------ */
      const clockEl = $('clock');
      const clockHM = $('clockHM');
      const clockSec = $('clockSec');

      function startClock() {
        const tick = () => {
          const now = new Date();

          clockHM.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
          clockSec.textContent = pad(now.getSeconds());
          clockEl.dateTime = now.toISOString();

          // Allinea il tick al cambio di secondo successivo.
          setTimeout(tick, 1000 - (Date.now() % 1000) + 15);
        };

        tick();
      }

      /* ------------------------------------------------------------------
         Codici meteo WMO -> etichetta + icona
         ------------------------------------------------------------------ */
      const WMO = {
        0: ['Sereno', 'sun'],
        1: ['Prevalentemente sereno', 'sun'],
        2: ['Parzialmente nuvoloso', 'partly'],
        3: ['Coperto', 'cloud'],
        45: ['Nebbia', 'fog'],
        48: ['Nebbia con brina', 'fog'],
        51: ['Pioviggine leggera', 'rain'],
        53: ['Pioviggine', 'rain'],
        55: ['Pioviggine intensa', 'rain'],
        56: ['Pioviggine gelata', 'rain'],
        57: ['Pioviggine gelata intensa', 'rain'],
        61: ['Pioggia leggera', 'rain'],
        63: ['Pioggia', 'rain'],
        65: ['Pioggia forte', 'rain'],
        66: ['Pioggia gelata', 'rain'],
        67: ['Pioggia gelata forte', 'rain'],
        71: ['Neve leggera', 'snow'],
        73: ['Neve', 'snow'],
        75: ['Neve forte', 'snow'],
        77: ['Granelli di neve', 'snow'],
        80: ['Rovesci leggeri', 'rain'],
        81: ['Rovesci', 'rain'],
        82: ['Rovesci forti', 'rain'],
        85: ['Rovesci di neve', 'snow'],
        86: ['Rovesci di neve forti', 'snow'],
        95: ['Temporale', 'storm'],
        96: ['Temporale con grandine', 'storm'],
        99: ['Temporale forte', 'storm']
      };

      function weatherInfo(code) {
        const entry = WMO[code];
        return entry
          ? { label: entry[0], icon: entry[1] }
          : { label: 'Variabile', icon: 'cloud' };
      }

      function iconSVG(name) {
        return `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
      }

      /* ------------------------------------------------------------------
         Meteo
         ------------------------------------------------------------------ */
      const weatherEl = $('weather');
      const placeEl = $('wxPlace');
      const retryBtn = $('wxRetry');
      let weatherBusy = false;

      async function getLocation() {
        if (CONFIG.fixedLocation) {
          return CONFIG.fixedLocation;
        }

        const cached = readJSON(LS_LOCATION);
        if (
          cached &&
          Number.isFinite(cached.latitude) &&
          Number.isFinite(cached.longitude) &&
          Date.now() - cached.at < CONFIG.locationCacheMs
        ) {
          return cached;
        }

        const providers = [
          async () => {
            const data = await fetchJSON('https://ipinfo.io/json', 6000);
            if (data && typeof data.loc === 'string') {
              const [latitude, longitude] = data.loc.split(',').map(Number);
              return buildLocation(data.city || data.region, latitude, longitude);
            }
            return null;
          },
          async () => {
            const data = await fetchJSON('https://ipwho.is/', 6000);
            if (data && data.success !== false) {
              return buildLocation(data.city || data.region, data.latitude, data.longitude);
            }
            return null;
          }
        ];

        for (const provider of providers) {
          try {
            const location = await provider();
            if (location) {
              const localized = await localizeName(location);
              if (localized) {
                location.name = localized;
              }
              writeJSON(LS_LOCATION, location);
              return location;
            }
          } catch (error) {
            console.warn('Rilevamento posizione non riuscito:', error);
          }
        }

        return CONFIG.fallbackLocation;
      }

      async function localizeName(location) {
        try {
          const url = new URL('https://api.bigdatacloud.net/data/reverse-geocode-client');
          url.searchParams.set('latitude', location.latitude);
          url.searchParams.set('longitude', location.longitude);
          url.searchParams.set('localityLanguage', 'it');
          const data = await fetchJSON(url.toString(), 4000);
          return data.city || data.locality || data.principalSubdivision || null;
        } catch {
          return null;
        }
      }

      function buildLocation(name, latitude, longitude) {
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
          return null;
        }
        return {
          name: name || 'Zona attuale',
          latitude,
          longitude,
          at: Date.now()
        };
      }

      async function fetchWeather(location) {
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.searchParams.set('latitude', location.latitude.toFixed(4));
        url.searchParams.set('longitude', location.longitude.toFixed(4));
        url.searchParams.set('current', 'temperature_2m,weather_code');
        url.searchParams.set('daily', 'weather_code,temperature_2m_max,temperature_2m_min');
        url.searchParams.set('timezone', 'auto');
        url.searchParams.set('forecast_days', '2');

        const data = await fetchJSON(url.toString());
        if (
          !data ||
          !data.current ||
          !data.daily ||
          !Array.isArray(data.daily.time) ||
          data.daily.time.length < 2
        ) {
          throw new Error('Risposta meteo non valida');
        }
        return data;
      }

      function renderWeather(weather, location) {
        placeEl.textContent = location.name || 'Zona attuale';
        placeEl.removeAttribute('title');
        retryBtn.hidden = true;

        const current = weather.current || {};
        const daily = weather.daily || {};
        const codes = daily.weather_code || [];
        const maxes = daily.temperature_2m_max || [];
        const mins = daily.temperature_2m_min || [];

        const today = weatherInfo(current.weather_code ?? codes[0]);
        $('wxTodayIcon').innerHTML = iconSVG(today.icon);
        $('wxTodayDesc').textContent = today.label;
        $('wxTodayTemp').textContent = fmtTemp(current.temperature_2m);
        $('wxTodayRange').textContent = `max ${fmtTemp(maxes[0])} · min ${fmtTemp(mins[0])}`;

        const tomorrow = weatherInfo(codes[1]);
        $('wxTomorrowIcon').innerHTML = iconSVG(tomorrow.icon);
        $('wxTomorrowDesc').textContent = tomorrow.label;
        $('wxTomorrowTemp').textContent = fmtTemp(maxes[1]);
        $('wxTomorrowNote').hidden = false;
        $('wxTomorrowRange').textContent = `min ${fmtTemp(mins[1])}`;

        weatherEl.setAttribute('aria-busy', 'false');
      }

      function setWeatherLoading() {
        placeEl.textContent = 'Rilevamento posizione…';
        retryBtn.hidden = true;
        weatherEl.setAttribute('aria-busy', 'true');

        $('wxTodayIcon').innerHTML = iconSVG('cloud');
        $('wxTomorrowIcon').innerHTML = iconSVG('cloud');
        $('wxTodayDesc').textContent = 'Caricamento…';
        $('wxTomorrowDesc').textContent = 'Caricamento…';
        $('wxTodayTemp').textContent = '—°';
        $('wxTomorrowTemp').textContent = '—°';
        $('wxTodayRange').textContent = 'max —° · min —°';
        $('wxTomorrowRange').textContent = 'min —°';
        $('wxTomorrowNote').hidden = true;
      }

      function showWeatherError() {
        placeEl.textContent = 'Meteo non disponibile';
        retryBtn.hidden = false;

        for (const prefix of ['Today', 'Tomorrow']) {
          $(`wx${prefix}Icon`).innerHTML = iconSVG('cloud');
          $(`wx${prefix}Desc`).textContent = 'Nessun dato';
          $(`wx${prefix}Temp`).textContent = '—°';
        }
        $('wxTodayRange').textContent = 'Riprova più tardi';
        $('wxTomorrowRange').textContent = 'Riprova più tardi';
        $('wxTomorrowNote').hidden = true;
      }

      async function loadWeather({ refresh = false } = {}) {
        if (weatherBusy) return;
        weatherBusy = true;
        retryBtn.hidden = true;

        const cached = readJSON(LS_WEATHER);
        const hasCache = Boolean(cached && cached.weather && cached.location);
        const cacheFresh = hasCache && Date.now() - cached.at < CONFIG.weatherCacheMs;

        if (hasCache) {
          renderWeather(cached.weather, cached.location);
        } else if (!refresh) {
          setWeatherLoading();
        }

        if (hasCache && cacheFresh && !refresh) {
          weatherBusy = false;
          return;
        }

        try {
          const location = await getLocation();
          const weather = await fetchWeather(location);
          renderWeather(weather, location);
          writeJSON(LS_WEATHER, { at: Date.now(), location, weather });
        } catch (error) {
          console.error('Impossibile caricare il meteo:', error);
          retryBtn.hidden = false;
          weatherEl.setAttribute('aria-busy', 'false');
          if (!hasCache) {
            showWeatherError();
          } else {
            placeEl.title = 'Aggiornamento non riuscito';
          }
        } finally {
          weatherBusy = false;
          weatherEl.setAttribute('aria-busy', 'false');
        }
      }

      retryBtn.addEventListener('click', () => loadWeather({ refresh: true }));

      /* ------------------------------------------------------------------
         Scorciatoie da tastiera
         ------------------------------------------------------------------ */
      const searchInput = $('q');

      function isTyping() {
        const el = document.activeElement;
        return Boolean(
          el &&
          (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)
        );
      }

      document.addEventListener('keydown', (event) => {
        if (event.defaultPrevented) return;
        const shortcut =
          event.key === '/' ||
          ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k');

        if (shortcut && !isTyping()) {
          event.preventDefault();
          searchInput.focus();
          searchInput.select();
        }
      });

      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          searchInput.blur();
        }
      });

      /* ------------------------------------------------------------------
         Note
         ------------------------------------------------------------------ */
      const notesEl = $('notes');
      const notesStatus = $('notesStatus');
      let notesTimer = 0;

      try {
        notesEl.value = localStorage.getItem(LS_NOTES) || '';
      } catch {
        /* Storage non disponibile: le note restano solo in memoria. */
      }

      notesEl.addEventListener('input', () => {
        notesStatus.textContent = 'Salvataggio…';
        window.clearTimeout(notesTimer);
        notesTimer = window.setTimeout(() => {
          try {
            localStorage.setItem(LS_NOTES, notesEl.value);
            notesStatus.textContent = 'Salvate in locale';
          } catch {
            notesStatus.textContent = 'Salvataggio non disponibile';
          }
        }, 400);
      });

      /* ------------------------------------------------------------------
         Avvio
         ------------------------------------------------------------------ */
      startClock();
      loadWeather();
      setInterval(() => loadWeather({ refresh: true }), CONFIG.weatherRefreshMs);
    })();
  </script>
